<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>GYM SPLIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e; --surface3:#282828;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --accent:#c8f135; --accent2:#a8d520; --red:#ff4444; --blue:#4499ff;
  --text:#f0f0f0; --muted:#888; --muted2:#555;
  --font-display:'Barlow Condensed',sans-serif; --font-body:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;}

.app-header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,0.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:10px 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.app-logo{font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:3px;color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.app-date{font-size:11px;color:var(--muted);letter-spacing:0.5px;}
.history-btn{
  background:none;border:1px solid var(--border2);border-radius:6px;
  color:var(--muted);font-family:var(--font-display);font-size:12px;font-weight:700;
  letter-spacing:1px;padding:5px 10px;cursor:pointer;transition:all 0.15s;
}
.history-btn.active{color:var(--accent);border-color:rgba(200,241,53,0.3);}

.day-strip{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--surface);}
.day-strip::-webkit-scrollbar{display:none;}
.day-btn{flex:1;min-width:48px;padding:10px 4px 9px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:2px solid transparent;transition:all 0.15s;}
.day-btn .dlabel{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;transition:color 0.15s;}
.day-btn .ddot{width:4px;height:4px;border-radius:50%;background:transparent;transition:background 0.15s;}
.day-btn.active{border-bottom-color:var(--accent);}
.day-btn.active .dlabel{color:var(--accent);}
.day-btn.active .ddot{background:var(--accent);}
.day-btn.today .dlabel{color:var(--text);}
.day-btn.has-log .ddot{background:var(--muted2);}
.day-btn.rest-day .dlabel{color:var(--muted2);}

.content{padding:14px 16px;max-width:600px;margin:0 auto;padding-bottom:100px;}

.day-header{margin-bottom:14px;}
.day-name{font-family:var(--font-display);font-size:32px;font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1;color:var(--text);}
.day-type{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
.rules{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.rule{font-size:11px;padding:4px 10px;border-radius:4px;font-weight:600;letter-spacing:0.3px;}
.rule-up{background:rgba(200,241,53,0.12);color:var(--accent);border:1px solid rgba(200,241,53,0.2);}
.rule-down{background:rgba(255,68,68,0.1);color:var(--red);border:1px solid rgba(255,68,68,0.2);}

.rest-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:12px;}
.rest-icon{font-family:var(--font-display);font-size:80px;font-weight:900;color:var(--muted2);letter-spacing:-2px;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.9}}
.rest-label{font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;}
.ex-card.logged{border-color:rgba(200,241,53,0.2);}
.ex-top{padding:14px 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.ex-name{font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;line-height:1.1;color:var(--text);}
.ex-sets{font-size:11px;color:var(--muted);margin-top:2px;}
.ex-badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:700;letter-spacing:0.5px;white-space:nowrap;margin-top:2px;flex-shrink:0;}
.badge-failure{background:rgba(255,68,68,0.1);color:#ff7777;border:1px solid rgba(255,68,68,0.2);}
.badge-strength{background:rgba(68,153,255,0.1);color:#77aaff;border:1px solid rgba(68,153,255,0.2);}
.badge-explosive{background:rgba(200,241,53,0.1);color:var(--accent);border:1px solid rgba(200,241,53,0.2);}
.badge-optional{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}

.ex-body{padding:0 14px 14px;}
.weight-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.weight-label{font-size:12px;color:var(--muted);min-width:48px;}
.weight-input-wrap{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:0 10px;flex:1;max-width:140px;}
.weight-input-wrap input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font-display);font-size:20px;font-weight:700;width:70px;padding:8px 0;}
.weight-input-wrap .unit{font-size:12px;color:var(--muted);}
.sets-grid{display:flex;gap:8px;flex-wrap:wrap;}
.set-block{flex:1;min-width:80px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.set-label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.reps-input-wrap{display:flex;align-items:center;gap:4px;}
.reps-input-wrap input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font-display);font-size:22px;font-weight:800;width:44px;padding:0;}
.reps-input-wrap .runit{font-size:11px;color:var(--muted2);}
.prog-hint{font-size:11px;font-weight:600;margin-top:8px;padding:6px 10px;border-radius:6px;display:none;letter-spacing:0.3px;}
.hint-up{background:rgba(200,241,53,0.08);color:var(--accent);border:1px solid rgba(200,241,53,0.15);display:block;}
.hint-down{background:rgba(255,68,68,0.08);color:var(--red);border:1px solid rgba(255,68,68,0.15);display:block;}

.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,10,10,0.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);padding:10px 16px 24px;
  display:flex;gap:8px;align-items:center;max-width:600px;margin:0 auto;
}
.save-btn{flex:1;background:var(--accent);color:#0a0a0a;border:none;border-radius:10px;padding:13px;font-family:var(--font-display);font-size:16px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;}
.save-btn:active{transform:scale(0.97);background:var(--accent2);}
.newweek-btn{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:10px;padding:13px 14px;font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.newweek-btn:active{background:var(--surface2);}
.toast{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;opacity:0;transition:opacity 0.3s;white-space:nowrap;min-width:44px;text-align:center;}
.toast.show{opacity:1;}

/* HISTORY */
.hist-title{font-family:var(--font-display);font-size:28px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--text);margin-bottom:4px;}
.hist-sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.week-selector{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:18px;padding-bottom:2px;}
.week-selector::-webkit-scrollbar{display:none;}
.week-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;transition:all 0.15s;flex-shrink:0;}
.week-chip.active{background:rgba(200,241,53,0.1);color:var(--accent);border-color:rgba(200,241,53,0.3);}
.prog-day{margin-bottom:16px;}
.prog-day-label{font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.prog-ex-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px;}
.prog-ex-row:last-child{border-bottom:none;}
.prog-ex-name{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;}
.prog-sets{display:flex;gap:5px;flex-shrink:0;}
.prog-set-chip{font-family:var(--font-display);font-size:13px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.prog-set-chip.great{background:rgba(200,241,53,0.08);color:var(--accent);border-color:rgba(200,241,53,0.2);}
.prog-set-chip.low{background:rgba(255,68,68,0.08);color:var(--red);border-color:rgba(255,68,68,0.2);}
.prog-weight{font-size:12px;color:var(--muted);min-width:52px;text-align:right;flex-shrink:0;}
.no-data{font-size:13px;color:var(--muted2);padding:20px 0;text-align:center;}
.empty-hist{padding:40px 0;text-align:center;}
.empty-hist-title{font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:1px;color:var(--muted2);margin-bottom:8px;}
.empty-hist-sub{font-size:13px;color:var(--muted2);line-height:1.6;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:22px 20px 38px;width:100%;max-width:600px;}
.modal-title{font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.modal-body{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:22px;}
.modal-actions{display:flex;gap:10px;}
.modal-confirm{flex:1;background:var(--accent);color:#0a0a0a;border:none;border-radius:10px;padding:14px;font-family:var(--font-display);font-size:15px;font-weight:900;letter-spacing:1px;cursor:pointer;}
.modal-cancel{flex:1;background:none;border:1px solid var(--border2);color:var(--muted);border-radius:10px;padding:14px;font-family:var(--font-display);font-size:15px;font-weight:700;cursor:pointer;}

.a2hs{margin:0 0 12px;background:rgba(200,241,53,0.06);border:1px solid rgba(200,241,53,0.15);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.a2hs-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">GYM SPLIT</div>
  <div class="header-right">
    <div class="app-date" id="dateLabel"></div>
    <button class="history-btn" id="histBtn" onclick="toggleHistory()">PROGRESS</button>
  </div>
</div>

<div class="day-strip" id="dayStrip"></div>

<div class="content">
  <div class="a2hs" id="a2hsBanner">
    <span>📱 Add to Home Screen for app-like access</span>
    <button class="a2hs-close" onclick="dismissA2hs()">×</button>
  </div>
  <div id="mainView"></div>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
  <button class="save-btn" onclick="saveSession()">SAVE</button>
  <button class="newweek-btn" onclick="showNewWeekModal()">NEW WEEK</button>
  <div class="toast" id="toast">SAVED</div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-title">Start New Week?</div>
    <div class="modal-body">This week's reps get archived in Progress so you can compare anytime. Your weights stay loaded — just update them if you're going heavier.</div>
    <div class="modal-actions">
      <button class="modal-confirm" onclick="confirmNewWeek()">ARCHIVE + RESET</button>
      <button class="modal-cancel" onclick="hideModal()">CANCEL</button>
    </div>
  </div>
</div>

<script>
const DAYS=[
  {label:"MON",name:"Legs + Chest",type:"Failure Day",exercises:[
    {name:"Squats",sets:2,badge:"strength",weight:145,note:"Leave 1 rep in tank"},
    {name:"Calf Raises",sets:2,badge:"failure",weight:180},
    {name:"Bench Press",sets:2,badge:"failure",weight:null},
    {name:"Incline SM Press",sets:2,badge:"failure",weight:95},
    {name:"Pec Dec Fly",sets:2,badge:"failure",weight:90},
    {name:"Leg Lifts",sets:2,badge:"failure",weight:null},
    {name:"Forearms",sets:2,badge:"optional",weight:null},
  ]},
  {label:"TUE",name:"Shoulders + Tris + Back",type:"Failure Day",exercises:[
    {name:"OHP Barbell",sets:2,badge:"failure",weight:65},
    {name:"Lateral Raises",sets:2,badge:"failure",weight:12},
    {name:"Bent Over Fly",sets:2,badge:"failure",weight:10},
    {name:"Dips",sets:2,badge:"failure",weight:null},
    {name:"Cable Tricep Extension",sets:2,badge:"failure",weight:50},
    {name:"Lat Pulldowns",sets:2,badge:"failure",weight:100},
    {name:"Single Arm Row",sets:2,badge:"failure",weight:null},
  ]},
  {label:"WED",name:"Abs + Legs + Biceps",type:"Failure Day",exercises:[
    {name:"Decline Sit-Ups",sets:2,badge:"failure",weight:10},
    {name:"Leg Lifts",sets:2,badge:"failure",weight:20},
    {name:"Hamstring Curl",sets:2,badge:"failure",weight:35},
    {name:"Leg Extensions",sets:2,badge:"failure",weight:70},
    {name:"Incline DB Curl",sets:2,badge:"failure",weight:25},
    {name:"Hammer Curls",sets:2,badge:"failure",weight:25},
  ]},
  {label:"THU",name:"Chest + Tris + Shoulders",type:"Failure Day",exercises:[
    {name:"Cable Crossover",sets:2,badge:"failure",weight:30,note:"Different chest angle"},
    {name:"Vertical Chest Press",sets:2,badge:"failure",weight:95},
    {name:"SM Skull Crushers",sets:2,badge:"failure",weight:55},
    {name:"Cable Rope Pushdown",sets:2,badge:"failure",weight:42.5},
    {name:"Lateral Raises",sets:2,badge:"failure",weight:15},
    {name:"Z-Bar Upright Rows",sets:2,badge:"failure",weight:60},
    {name:"Bent Over Fly",sets:2,badge:"failure",weight:15},
  ]},
  {label:"FRI",name:"Abs + Back",type:"Failure Day",exercises:[
    {name:"Decline Sit-Ups",sets:2,badge:"failure",weight:null},
    {name:"Russian Twists",sets:2,badge:"failure",weight:null},
    {name:"Dumbbell Row",sets:2,badge:"failure",weight:null},
    {name:"SM Shrugs",sets:2,badge:"failure",weight:null},
    {name:"Pull-Ups",sets:2,badge:"failure",weight:null},
    {name:"Face Pulls",sets:2,badge:"failure",weight:null,note:"Rear delt health"},
    {name:"Forearms",sets:2,badge:"optional",weight:null},
  ]},
  {label:"SAT",name:"Vertical + Explosive",type:"Power Day",exercises:[
    {name:"Weighted Jumps",sets:4,badge:"explosive",weight:null,scheme:"4×3",note:"Max power — not failure"},
    {name:"Cleans",sets:4,badge:"explosive",weight:null,scheme:"4×3",note:"Max power — not failure"},
    {name:"Lunges",sets:2,badge:"failure",weight:null},
    {name:"Nordic Curls",sets:2,badge:"failure",weight:null,note:"Hamstring prevention"},
  ]},
  {label:"SUN",name:"Rest",type:"rest"}
];

const BADGE_LABELS={failure:"TO FAILURE",strength:"STRENGTH",explosive:"EXPLOSIVE",optional:"OPTIONAL"};
const KEY_CUR='gs_current', KEY_HIST='gs_history', KEY_A2HS='gs_a2hs';

let logData={}, history=[], dismissed=false;
let activeDay=0, showingHistory=false, historyWeekIdx=0;

function load(){
  try{logData=JSON.parse(localStorage.getItem(KEY_CUR)||'{}');}catch(e){logData={};}
  try{history=JSON.parse(localStorage.getItem(KEY_HIST)||'[]');}catch(e){history=[];}
  try{dismissed=localStorage.getItem(KEY_A2HS)==='1';}catch(e){}
}
function persist(){
  try{localStorage.setItem(KEY_CUR,JSON.stringify(logData));localStorage.setItem(KEY_HIST,JSON.stringify(history));}catch(e){}
}

function getTodayIdx(){const d=new Date().getDay();return d===0?6:d-1;}

function getWeekLabel(date){
  const d=new Date(date);
  const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const f=x=>x.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return f(mon)+' – '+f(sun);
}
function getWeekKey(date){
  const d=new Date(date);
  const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  return mon.toISOString().slice(0,10);
}

function init(){
  load();
  document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  if(dismissed)document.getElementById('a2hsBanner').style.display='none';
  activeDay=getTodayIdx();
  buildTabs();renderDay();
}

function buildTabs(){
  const strip=document.getElementById('dayStrip');strip.innerHTML='';
  const todayIdx=getTodayIdx();
  DAYS.forEach((d,i)=>{
    const btn=document.createElement('button');
    let cls='day-btn';
    if(i===activeDay)cls+=' active';
    if(i===todayIdx)cls+=' today';
    if(d.type==='rest')cls+=' rest-day';
    const hasLog=Object.keys(logData).some(k=>k.startsWith(`d${i}_`)&&k.endsWith('_r')&&logData[k]);
    if(hasLog)cls+=' has-log';
    btn.className=cls;
    btn.innerHTML=`<span class="dlabel">${d.label}</span><span class="ddot"></span>`;
    btn.onclick=()=>{
      if(showingHistory){showingHistory=false;document.getElementById('histBtn').classList.remove('active');}
      activeDay=i;buildTabs();renderDay();
    };
    strip.appendChild(btn);
  });
}

function renderDay(){
  const d=DAYS[activeDay];
  const view=document.getElementById('mainView');
  const bar=document.getElementById('bottomBar');
  if(d.type==='rest'){
    bar.style.display='none';
    view.innerHTML=`<div class="rest-screen"><div class="rest-icon">ZZZ</div><div class="rest-label">Rest &amp; Recover</div></div>`;
    return;
  }
  bar.style.display='flex';
  let html=`<div class="day-header">
    <div class="day-name">${d.name}</div>
    <div class="day-type">${d.type}</div>
    <div class="rules">
      <span class="rule rule-up">12+ reps → add weight</span>
      <span class="rule rule-down">&lt;6 reps → lower weight</span>
    </div>
  </div>`;
  d.exercises.forEach((ex,ei)=>{
    const wKey=`d${activeDay}_e${ei}_w`;
    const wVal=logData[wKey]!==undefined?logData[wKey]:(ex.weight!==null?ex.weight:'');
    const isLogged=Array.from({length:ex.sets},(_,s)=>logData[`d${activeDay}_e${ei}_s${s}_r`]).some(v=>v);
    html+=`<div class="ex-card${isLogged?' logged':''}" id="card_${ei}">
      <div class="ex-top">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets">${ex.scheme||ex.sets+' sets'}${ex.note?' · '+ex.note:''}</div>
        </div>
        <span class="ex-badge badge-${ex.badge}">${BADGE_LABELS[ex.badge]||ex.badge}</span>
      </div>
      <div class="ex-body">
        <div class="weight-row">
          <div class="weight-label">Weight</div>
          <div class="weight-input-wrap">
            <input type="number" inputmode="decimal" value="${wVal}" placeholder="0" step="2.5"
              oninput="saveField('${wKey}',this.value);checkCard(${ei})"/>
            <span class="unit">lbs</span>
          </div>
        </div>
        <div class="sets-grid">`;
    for(let s=0;s<ex.sets;s++){
      const rKey=`d${activeDay}_e${ei}_s${s}_r`;
      const rVal=logData[rKey]||'';
      html+=`<div class="set-block">
        <div class="set-label">Set ${s+1}</div>
        <div class="reps-input-wrap">
          <input type="number" inputmode="numeric" value="${rVal}" placeholder="—" min="1" max="99"
            oninput="onReps(this,'${rKey}',${ei})"/>
          <span class="runit">reps</span>
        </div>
      </div>`;
    }
    html+=`</div><div class="prog-hint" id="hint_${ei}"></div></div></div>`;
  });
  view.innerHTML=html;
  d.exercises.forEach((ex,ei)=>{
    let arr=[];
    for(let s=0;s<ex.sets;s++){const v=logData[`d${activeDay}_e${ei}_s${s}_r`];if(v)arr.push(parseInt(v));}
    if(arr.length)updateHint(ei,Math.max(...arr));
  });
}

function onReps(input,key,ei){
  saveField(key,input.value);
  const val=parseInt(input.value);
  if(!isNaN(val))updateHint(ei,val);
  checkCard(ei);
}
function updateHint(ei,reps){
  const hint=document.getElementById('hint_'+ei);if(!hint)return;
  if(reps>=12){hint.textContent='↑ Add weight next session';hint.className='prog-hint hint-up';}
  else if(reps<6&&reps>0){hint.textContent='↓ Lower weight next session';hint.className='prog-hint hint-down';}
  else{hint.className='prog-hint';}
}
function checkCard(ei){
  const card=document.getElementById('card_'+ei);if(!card)return;
  const ex=DAYS[activeDay].exercises[ei];
  const hasLog=Array.from({length:ex.sets},(_,s)=>logData[`d${activeDay}_e${ei}_s${s}_r`]).some(v=>v);
  card.classList.toggle('logged',!!hasLog);
}
function saveField(key,val){logData[key]=val;}

function saveSession(){
  persist();buildTabs();
  const t=document.getElementById('toast');
  t.textContent='SAVED';t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

// NEW WEEK
function showNewWeekModal(){document.getElementById('modalOverlay').style.display='flex';}
function hideModal(){document.getElementById('modalOverlay').style.display='none';}
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))hideModal();}

function confirmNewWeek(){
  hideModal();
  const hasReps=Object.keys(logData).some(k=>k.endsWith('_r')&&logData[k]);
  if(hasReps){
    const weekKey=getWeekKey(new Date());
    const weekLabel=getWeekLabel(new Date());
    history=history.filter(w=>w.weekKey!==weekKey);
    history.unshift({weekKey,label:weekLabel,data:JSON.parse(JSON.stringify(logData))});
    if(history.length>16)history=history.slice(0,16);
  }
  // Keep weights, clear reps
  const newLog={};
  Object.keys(logData).forEach(k=>{if(k.endsWith('_w'))newLog[k]=logData[k];});
  logData=newLog;
  persist();buildTabs();renderDay();
  const t=document.getElementById('toast');
  t.textContent='NEW WEEK';t.classList.add('show');
  setTimeout(()=>{t.classList.remove('show');t.textContent='SAVED';},2200);
}

// HISTORY / PROGRESS
function toggleHistory(){
  showingHistory=!showingHistory;
  document.getElementById('histBtn').classList.toggle('active',showingHistory);
  if(showingHistory){
    document.getElementById('bottomBar').style.display='none';
    historyWeekIdx=0;
    renderHistory();
  }else{
    renderDay();
    if(DAYS[activeDay].type!=='rest')document.getElementById('bottomBar').style.display='flex';
  }
}

function buildWeekList(){
  const list=[];
  const hasReps=Object.keys(logData).some(k=>k.endsWith('_r')&&logData[k]);
  if(hasReps)list.push({label:'This Week ('+getWeekLabel(new Date())+')',data:logData,isCurrent:true});
  history.forEach(w=>list.push(w));
  return list;
}

function renderHistory(){
  const view=document.getElementById('mainView');
  const allWeeks=buildWeekList();
  if(allWeeks.length===0){
    view.innerHTML=`<div>
      <div class="hist-title">Progress</div>
      <div class="empty-hist">
        <div class="empty-hist-title">NO DATA YET</div>
        <div class="empty-hist-sub">Log your reps each session, then hit<br><strong style="color:var(--text)">NEW WEEK</strong> at the end of the week.<br>Every week gets saved here for comparison.</div>
      </div>
    </div>`;
    return;
  }
  const w=allWeeks[historyWeekIdx];
  const data=w.data;
  const chips=allWeeks.map((wk,i)=>`<button class="week-chip${i===historyWeekIdx?' active':''}" onclick="selectHistWeek(${i})">${wk.label}</button>`).join('');
  let rows='';
  DAYS.forEach((day,di)=>{
    if(day.type==='rest')return;
    const dayRows=day.exercises.map((ex,ei)=>{
      const wVal=data[`d${di}_e${ei}_w`];
      const sets=Array.from({length:ex.sets},(_,s)=>{const r=parseInt(data[`d${di}_e${ei}_s${s}_r`]||'');return isNaN(r)?null:r;}).filter(x=>x!==null);
      if(!sets.length)return'';
      const chips2=sets.map(r=>{let cls='';if(r>=12)cls=' great';else if(r<6)cls=' low';return`<span class="prog-set-chip${cls}">${r}</span>`;}).join('');
      const wLabel=wVal?`<span class="prog-weight">${wVal} lbs</span>`:'';
      return`<div class="prog-ex-row"><div class="prog-ex-name">${ex.name}</div><div class="prog-sets">${chips2}</div>${wLabel}</div>`;
    }).filter(Boolean).join('');
    if(dayRows)rows+=`<div class="prog-day"><div class="prog-day-label">${day.label} — ${day.name}</div>${dayRows}</div>`;
  });
  if(!rows)rows=`<div class="no-data">No reps logged for this week.</div>`;
  view.innerHTML=`<div>
    <div class="hist-title">Progress</div>
    <div class="hist-sub">Green chips = hit 12+ (go heavier). Red = under 6 (lower weight).</div>
    <div class="week-selector">${chips}</div>
    ${rows}
  </div>`;
}

function selectHistWeek(idx){historyWeekIdx=idx;renderHistory();}

function dismissA2hs(){
  document.getElementById('a2hsBanner').style.display='none';
  try{localStorage.setItem(KEY_A2HS,'1');}catch(e){}
}

init();
</script>
</body>
